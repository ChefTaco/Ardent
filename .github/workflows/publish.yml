name: Publish to npm

# Publishes @hivemagnus/ardent, then @hivemagnus/ardent-client (client/), with provenance when
# their version is not on npm yet. Both carry the same version (npm run release:version -- X.Y.Z).
# - Push a tag vX.Y.Z (matching both package.json files) to publish.
# - Run it by hand (Actions > Publish to npm > Run workflow) for a dry run of both packages.
# Publishing waits for approval on the `npm-publish` environment, then authenticates to npm
# through trusted publishing (OIDC). No npm token is stored in this repository.
# A version already on npm is skipped, so a failed client step can be re-run after the runtime
# was published.
#
# Each package needs its own trusted publisher on npmjs.com, and npm can configure one only for
# a package that already exists. Before the first release that carries the client, an owner
# publishes @hivemagnus/ardent-client once by hand (it then has no provenance), then runs:
#   npm trust github @hivemagnus/ardent-client --file publish.yml --repo ChefTaco/Ardent --env npm-publish --allow-publish
# Check it with `npm trust list @hivemagnus/ardent-client`. Later releases publish it here.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and validate only; publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      actions: read # read environment protection before any publication
      id-token: write # trusted publishing and provenance
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require protected publication environment
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-publish-environment.mjs

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Put node on the system PATH
        # Ardent starts Codex and its test fixtures with a minimal system PATH.
        run: sudo ln -sf "$(command -v node)" /usr/bin/node && /usr/bin/node --version

      - name: Check npm supports provenance and trusted publishing
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm >= 11.5.1 is required"); process.exit(1) }' "$(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Gates
        run: |
          npm audit --omit=dev --audit-level=high
          npm run verify
          node scripts/check-cli.mjs
          node scripts/check-chat.mjs
          node scripts/check-schedule.mjs
          node scripts/check-native.mjs

      - name: Publish runtime
        run: node scripts/publish-package.mjs runtime

      - name: Publish client
        run: node scripts/publish-package.mjs client
